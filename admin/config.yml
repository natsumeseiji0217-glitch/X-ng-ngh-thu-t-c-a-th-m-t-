backend:
  name: github
  repo: TEN-GITHUB/TEN-REPO   # <- SỬA: tên-github/tên-repo của bạn
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "web"
    label: "Nội dung web"
    files:
      - name: "prices"
        label: "Bảng giá"
        file: "content/prices.json"
        fields:
          - label: "Các loại tranh"
            label_singular: "loại tranh"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - {label: "Tên", name: "name", widget: "string"}
              - {label: "Giá (ví dụ 145.000)", name: "price", widget: "string"}
              - {label: "Nhãn nhỏ (ví dụ giá 1 char, có thể để trống)", name: "tag", widget: "string", required: false}
          - {label: "Ghi chú dưới bảng giá", name: "note", widget: "string", required: false}
          - label: "Phụ phí & tuỳ chọn"
            label_singular: "mục"
            name: "addons"
            widget: "list"
            summary: "{{fields.name}} — {{fields.value}}"
            fields:
              - {label: "Tên", name: "name", widget: "string"}
              - {label: "Giá trị (ví dụ +100%)", name: "value", widget: "string"}
              - {label: "Chú thích nhỏ (có thể để trống)", name: "hint", widget: "string", required: false}
              - {label: "Miễn phí? (hiện màu xanh)", name: "free", widget: "boolean", default: false}
      - name: "gallery"
        label: "Gallery sample"
        file: "content/gallery.json"
        fields:
          - label: "Ảnh"
            label_singular: "ảnh"
            name: "images"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - {label: "Ảnh", name: "image", widget: "image"}
              - {label: "Chú thích", name: "caption", widget: "string", required: false}
              - {label: "Loại (Full body, Manga... dùng để lọc)", name: "type", widget: "string", required: false}
